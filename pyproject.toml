[project]
name = "marquand"
version = "0.1.0"
description = "Local drop-in for the TypeSafe Jev (System One) API, running on llama.cpp"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["llama-cpp-python==0.3.35"]

[project.optional-dependencies]
test = ["pytest", "typesafe-sdk"]

[project.scripts]
marq = "marq.cli:main"

[tool.setuptools]
packages = ["marq"]

[tool.setuptools.package-data]
marq = ["models.json"]
